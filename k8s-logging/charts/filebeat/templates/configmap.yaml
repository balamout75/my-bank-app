apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: monitoring
data:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: false
          templates:
            # Собираем логи только из namespace mybank
            - condition:
                equals:
                  kubernetes.namespace: {{ .Values.watchNamespace }}
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  # Логи уже в ECS JSON формат — не парсим, передаём как есть
                  json.keys_under_root: true
                  json.overwrite_keys: true
                  json.message_key: message
                  json.ignore_decoding_error: true

    processors:
      # Добавляем Kubernetes метаданные (pod, namespace, labels)
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
      # Убираем лишние поля
      - drop_fields:
          fields: ["agent", "ecs", "host", "input", "log.offset"]
          ignore_missing: true

    output.logstash:
      hosts: ["logstash-service:5044"]

    # Уровень логов самого Filebeat
    logging.level: warning
    logging.to_files: false

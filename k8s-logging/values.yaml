# ============================================================
# ELK Stack — values.yaml
# Namespace: monitoring (рядом с Prometheus)
# ============================================================

global:
  elasticsearchHost: "elasticsearch-service"
  elasticsearchPort: 9200
  imageTag: "8.12.0"

# ── Elasticsearch ────────────────────────────────────────────
elasticsearch:
  replicaCount: 1
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "8.12.0"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    size: 10Gi
  javaOpts: "-Xms512m -Xmx512m"
  service:
    port: 9200

# ── Logstash ─────────────────────────────────────────────────
logstash:
  enabled: true
  image:
    repository: docker.elastic.co/logstash/logstash
    tag: "8.12.0"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  javaOpts: "-Xms256m -Xmx256m"
  service:
    beatsPort: 5044   # Filebeat → Logstash
    tcpPort: 5000     # совместимость с docker-compose

# ── Kibana ───────────────────────────────────────────────────
kibana:
  enabled: true
  image:
    repository: docker.elastic.co/kibana/kibana
    tag: "8.12.0"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    port: 5601

# ── Filebeat ─────────────────────────────────────────────────
filebeat:
  enabled: true
  image:
    repository: docker.elastic.co/beats/filebeat
    tag: "8.12.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  # Собирать логи только из namespace mybank
  watchNamespace: "mybank"

apiVersion: v2
name: logging
description: ELK stack для mybank — Elasticsearch, Logstash, Kibana, Filebeat
type: application
version: 1.0.0
appVersion: "8.12.0"

dependencies:
  - name: elasticsearch
    version: "1.0.0"
    repository: "file://charts/elasticsearch"
  - name: logstash
    version: "1.0.0"
    repository: "file://charts/logstash"
    condition: logstash.enabled
  - name: kibana
    version: "1.0.0"
    repository: "file://charts/kibana"
    condition: kibana.enabled
  - name: filebeat
    version: "1.0.0"
    repository: "file://charts/filebeat"
    condition: filebeat.enabled

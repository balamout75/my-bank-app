spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///dummy?currentSchema=transfer
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: transfer
    liquibase-schema: public
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
  security:
    oauth2:
      client:
        registration: {}
        provider: {}

clients:
  accounts:
    url: http://localhost/dummy
  notifications:
    url: http://localhost/dummy

logging:
  level:
    root: INFO
    org.testcontainers: INFO
    org.springframework.security: WARN
    kafka: WARN
    org.apache.kafka: WARN
    state.change.logger: WARN

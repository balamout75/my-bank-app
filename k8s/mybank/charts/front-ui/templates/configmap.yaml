apiVersion: v1
kind: ConfigMap
metadata:
  name: mybank-front-ui
  labels:
    app: front-ui
    app.kubernetes.io/name: front-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application-k8s.yml: |
    server:
      port: 8081
    spring:
      application:
        name: front-ui
      http:
        clients:
          connect-timeout: 2s
          read-timeout: 3s
      thymeleaf:
        cache: false
      security:
        oauth2:
          client:
            registration:
              keycloak:
                client-id: front-ui
                client-secret: ${OAUTH2_CLIENT_SECRET}
                scope: openid,profile,email
                authorization-grant-type: authorization_code
                redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider:
              keycloak:
                issuer-uri: http://{{ .Values.global.keycloakHost }}/realms/mybank
    # Gateway URL — через K8s DNS (внутрикластерный)
    gateway:
      url: http://mybank-gateway-service:8090

    # Отключаем Eureka
    eureka:
      client:
        enabled: false

    # Resilience4j
    resilience4j:
      retry:
        retry-aspect-order: 2
        instances:
          accounts-read:
            max-attempts: 3
            wait-duration: 300ms
            exponential-backoff-multiplier: 2
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.io.IOException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
            ignore-exceptions:
              - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          business-service-read:
            max-attempts: 3
            wait-duration: 200ms
            exponential-backoff-multiplier: 2
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.io.IOException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
            ignore-exceptions:
              - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          business-service-write:
            max-attempts: 3
            wait-duration: 200ms
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.io.IOException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
              - org.springframework.web.client.HttpServerErrorException
            ignore-exceptions:
              - io.github.resilience4j.circuitbreaker.CallNotPermittedException
              - org.springframework.web.client.HttpClientErrorException

      circuitbreaker:
        circuitbreaker-aspect-order: 1
        instances:
          accounts-read:
            sliding-window-type: COUNT_BASED
            sliding-window-size: 10
            minimum-number-of-calls: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 2
            automatic-transition-from-open-to-half-open-enabled: true
          business-service-read:
            sliding-window-type: COUNT_BASED
            sliding-window-size: 10
            minimum-number-of-calls: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 2
            automatic-transition-from-open-to-half-open-enabled: true
          business-service-write:
            sliding-window-type: COUNT_BASED
            sliding-window-size: 10
            minimum-number-of-calls: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 2
            automatic-transition-from-open-to-half-open-enabled: true
            ignore-exceptions:
              - org.springframework.web.client.HttpClientErrorException
            record-exceptions:
              - org.springframework.web.client.HttpServerErrorException
              - org.springframework.web.client.ResourceAccessException
              - java.io.IOException

    management:
      endpoints:
        web:
          exposure:
            include: health,info,circuitbreakers,retries,metrics,prometheus
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true   # важно для k8s readiness/liveness
      health:
        circuitbreakers:
          enabled: true
      tracing:
        sampling:
          probability: 1.0  # для проверки, чтобы всегда были трейсы
        service-name: ${spring.application.name}
        export:
          zipkin:
            endpoint: http://mybank-zipkin:9411/api/v2/spans

    logging:
      structured:
        format:
          console: ecs 
      level:
        com.mybank.frontend: DEBUG

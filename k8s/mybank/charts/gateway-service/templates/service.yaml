apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway-service
  labels:
    app: gateway-service
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8090
      name: http
  selector:
    app: gateway-service
    app.kubernetes.io/instance: {{ .Release.Name }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  KC_SECRET_ACCOUNTS:  {{ .Values.clientSecrets.accounts | quote }}
  KC_SECRET_CASH:      {{ .Values.clientSecrets.cash | quote }}
  KC_SECRET_TRANSFER:  {{ .Values.clientSecrets.transfer | quote }}
  KC_SECRET_FRONTEND:  {{ .Values.clientSecrets.frontend | quote }}

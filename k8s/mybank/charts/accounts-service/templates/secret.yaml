apiVersion: v1
kind: Secret
metadata:
  name: mybank-accounts-service
  labels:
    app: accounts-service
    app.kubernetes.io/name: accounts-service
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://mybank-postgresql:{{ .Values.global.postgresql.port }}/{{ .Values.global.postgresql.database }}?currentSchema={{ .Values.db.schema }}"
  DB_USER: {{ .Values.global.postgresql.username }}
  DB_PASSWORD: {{ .Values.global.postgresql.password }}
  OAUTH2_CLIENT_SECRET: {{ .Values.keycloak.clientSecret }}
  KAFKA_BOOTSTRAP_SERVERS: "mybank-kafka:9092"

apiVersion: v1
kind: ConfigMap
metadata:
  name: mybank-accounts-service
  labels:
    app: accounts-service
    app.kubernetes.io/name: accounts-service
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application-k8s.yml: |
    server:
      port: 8080
    spring:
      application:
        name: accounts-service
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        template:
          observation-enabled: true 
        admin:
          fail-fast: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
          acks: all                # at-least-once: ждём подтверждения от всех реплик
          retries: 3
          properties:
            spring.json.add.type.headers: false	
            enable.idempotence: true  # Исключает дубли на уровне producer
            max.in.flight.requests.per.connection: 1
      datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
      liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
        default-schema: {{ .Values.db.schema }}
        liquibase-schema: public
      security:
        oauth2:
          client:
            registration:
              accounts-service:
                provider: accounts-service
                client-id: accounts-service
                client-secret: ${OAUTH2_CLIENT_SECRET}
                authorization-grant-type: client_credentials
            provider:
              accounts-service:
                # Внутренний URL Keycloak для получения токенов
                issuer-uri: http://{{ .Values.global.keycloakHost }}/realms/mybank
          resourceserver:
            jwt:
              # jwk-set-uri вместо issuer-uri — обход проблемы issuer mismatch
              issuer-uri: http://{{ .Values.global.keycloakHost }}/realms/mybank  
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            default_schema: {{ .Values.db.schema }}
    # Отключаем Eureka
    eureka:
      client:
        enabled: false

    application:
      kafka:
        topic:
          notifications: notifications
          partitions: 3
          replicas: 1
      outbox:
        fixed-delay-ms: 5000
        order:
          limit: 10
        max-attempts: 5

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true   # важно для k8s readiness/liveness
      health:
        circuitbreakers:
          enabled: true
      tracing:
        sampling:
          probability: 1.0  # для проверки, чтобы всегда были трейсы
        service-name: ${spring.application.name}
        export:
          zipkin:
            endpoint: http://mybank-zipkin:9411/api/v2/spans    

    logging:
      structured:
        format:
          console: ecs 
      level:
        com.mybank.accounts: DEBUG
        org.apache.kafka: WARN
        org.springframework.kafka: WARN
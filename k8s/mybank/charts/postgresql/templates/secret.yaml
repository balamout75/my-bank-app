apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.global.postgresql.database }}
  POSTGRES_USER: {{ .Values.global.postgresql.username }}
  POSTGRES_PASSWORD: {{ .Values.global.postgresql.password }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: mybank-cash-service
  labels:
    app: cash-service
    app.kubernetes.io/name: cash-service
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: cash-service      
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        template:
          observation-enabled: true 
        admin:
          fail-fast: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
          acks: all                # at-least-once: ждём подтверждения от всех реплик
          retries: 3
          properties:
            spring.json.add.type.headers: false	
            enable.idempotence: true  # Исключает дубли на уровне producer
            max.in.flight.requests.per.connection: 1
      datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
      liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
        default-schema: {{ .Values.db.schema }}
        liquibase-schema: public
      security:
        oauth2:
          client:
            registration:
              cash-service:
                provider: cash-service
                client-id: cash-service
                client-secret: ${OAUTH2_CLIENT_SECRET}
                authorization-grant-type: client_credentials
            provider:
              cash-service:
                issuer-uri: http://{{ .Values.global.keycloakHost }}/realms/mybank
          resourceserver:
            jwt:
              issuer-uri: http://{{ .Values.global.keycloakHost }}/realms/mybank

    application:
      kafka:
        topic:
          notifications: notifications
          partitions: 3
          replicas: 1
      outbox:
        fixed-delay-ms: 5000
        order:
          limit: 10
        max-attempts: 5

    resilience4j:
      retry:
        retry-aspect-order: 2
        instances:
          accounts-service:
            max-attempts: 3
            wait-duration: 500ms
            exponential-backoff-multiplier: 2
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - org.springframework.web.client.HttpServerErrorException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
              - java.io.IOException
            ignore-exceptions:
              - io.github.resilience4j.circuitbreaker.CallNotPermittedException
              - org.springframework.web.client.HttpClientErrorException
      circuitbreaker:
        circuitbreaker-aspect-order: 1
        instances:
          accounts-service:
            register-health-indicator: true
            sliding-window-type: COUNT_BASED
            sliding-window-size: 10
            minimum-number-of-calls: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 30s
            permitted-number-of-calls-in-half-open-state: 3
            automatic-transition-from-open-to-half-open-enabled: true
            ignore-exceptions:
              - org.springframework.web.client.HttpClientErrorException
            record-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - org.springframework.web.client.HttpServerErrorException
              - java.io.IOException
              - java.net.SocketTimeoutException
      timelimiter:
        instances:
          accounts-service:
            timeout-duration: 5s

    management:
      endpoints:
        web:
          exposure:
            include: health,info,circuitbreakers,retries,metrics,prometheus
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true   # важно для k8s readiness/liveness
      health:
        circuitbreakers:
          enabled: true
      tracing:
        sampling:
          probability: 1.0  # для проверки, чтобы всегда были трейсы
        service-name: ${spring.application.name}
        export:
          zipkin:
            endpoint: http://mybank-zipkin:9411/api/v2/spans    

    logging:
      structured:
        format:
          console: ecs 
      level:
        com.mybank.cash: DEBUG
        org.apache.kafka: WARN
        org.springframework.kafka: WARN

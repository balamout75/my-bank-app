apiVersion: v2
name: k8s-monitoring
description: |
  Единый observability чарт для mybank:
  - Prometheus + Grafana + Alertmanager (kube-prometheus-stack)
  - Elasticsearch + Logstash + Kibana + Filebeat (ELK)
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  # ── Метрики ──────────────────────────────────────────────
  - name: kube-prometheus-stack
    version: ">=45.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheusStack.enabled

  # ── Логи (ELK) ───────────────────────────────────────────
  - name: elasticsearch
    version: "1.0.0"
    repository: "file://charts/elasticsearch"
    condition: elasticsearch.enabled

  - name: logstash
    version: "1.0.0"
    repository: "file://charts/logstash"
    condition: logstash.enabled

  - name: kibana
    version: "1.0.0"
    repository: "file://charts/kibana"
    condition: kibana.enabled

  - name: filebeat
    version: "1.0.0"
    repository: "file://charts/filebeat"
    condition: filebeat.enabled

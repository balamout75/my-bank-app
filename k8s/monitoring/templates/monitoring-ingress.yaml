{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: k8s-monitoring
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  rules:

    # ── Prometheus ───────────────────────────────────────────
    - host: {{ .Values.ingress.hosts.prometheus }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-monitoring-kube-promet-prometheus
                port:
                  number: 9090

    # ── Grafana ──────────────────────────────────────────────
    - host: {{ .Values.ingress.hosts.grafana }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-monitoring-grafana
                port:
                  number: 80

    # ── Alertmanager ─────────────────────────────────────────
    - host: {{ .Values.ingress.hosts.alertmanager }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-monitoring-kube-promet-alertmanager
                port:
                  number: 9093

    # ── Kibana ───────────────────────────────────────────────
    - host: {{ .Values.ingress.hosts.kibana }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-service
                port:
                  number: 5601

    # ── Zipkin ───────────────────────────────────────────────
    - host: {{ .Values.ingress.hosts.zipkin }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zipkin
                port:
                  number: 9411

{{- end }}

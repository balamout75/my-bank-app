image:
  repository: mybank/yp-mybank-frontend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations: {}

keycloak:
  clientSecret: ""  # Injected via --set from Jenkins credentials

monitoring:
  enabled: true

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-accounts-service
  labels:
    app: accounts-service
    app.kubernetes.io/name: accounts-service
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application-k8s.yml: |
    server:
      port: 8080
    spring:
      application:
        name: accounts-service
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        admin:
          fail-fast: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
          acks: all                # at-least-once: ждём подтверждения от всех реплик
          retries: 3
          properties:
            spring.json.add.type.headers: false	
            enable.idempotence: true  # Исключает дубли на уровне producer
            max.in.flight.requests.per.connection: 1
      datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
      liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
        default-schema: {{ .Values.db.schema }}
        liquibase-schema: public
      security:
        oauth2:
          client:
            registration:
              accounts-service:
                provider: accounts-service
                client-id: accounts-service
                client-secret: ${OAUTH2_CLIENT_SECRET}
                authorization-grant-type: client_credentials
            provider:
              accounts-service:
                # Внутренний URL Keycloak для получения токенов
                issuer-uri: http://{{ .Values.global.keycloakHost }}/realms/mybank
          resourceserver:
            jwt:
              # jwk-set-uri вместо issuer-uri — обход проблемы issuer mismatch
              issuer-uri: http://{{ .Values.global.keycloakHost }}/realms/mybank  
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            default_schema: {{ .Values.db.schema }}
      # Статические instances для lb:// (замена Eureka)
      cloud:
        discovery:
          client:
            simple:
              instances:
                notifications-service:
                  - uri: http://{{ .Release.Name }}-notifications-service:8080
    # Отключаем Eureka
    eureka:
      client:
        enabled: false

    application:
      outbox:
        fixed-delay-ms: 5000
        order:
          limit: 10
        max-attempts: 5

    resilience4j:
      retry:
        retry-aspect-order: 2
        instances:
          notifications-service:
            max-attempts: 2
            wait-duration: 300ms
            exponential-backoff-multiplier: 2
            retry-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.net.ConnectException
              - java.net.SocketTimeoutException
              - java.io.IOException
            ignore-exceptions:
              - io.github.resilience4j.circuitbreaker.CallNotPermittedException
              - org.springframework.web.client.HttpClientErrorException$BadRequest
              - org.springframework.web.client.HttpClientErrorException$NotFound
              - org.springframework.web.client.HttpClientErrorException$Forbidden
              - org.springframework.web.client.HttpClientErrorException$Unauthorized
      circuitbreaker:
        circuitbreaker-aspect-order: 1
        instances:
          notifications-service:
            record-exceptions:
              - org.springframework.web.client.ResourceAccessException
              - java.io.IOException
              - java.net.SocketTimeoutException
            register-health-indicator: true
            sliding-window-type: COUNT_BASED
            sliding-window-size: 5
            minimum-number-of-calls: 3
            failure-rate-threshold: 50
            wait-duration-in-open-state: 15s
            permitted-number-of-calls-in-half-open-state: 2
            automatic-transition-from-open-to-half-open-enabled: true

    management:
      endpoints:
        web:
          exposure:
            include: health,info,circuitbreakers,retries,metrics,prometheus
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true   # важно для k8s readiness/liveness
      health:
        circuitbreakers:
          enabled: true
      tracing:
        sampling:
          probability: 1.0  # для проверки, чтобы всегда были трейсы
        service-name: ${spring.application.name}
      zipkin:
        tracing:
          endpoint: http://{{ .Release.Name }}-zipkin:9411/api/v2/spans
    
    logging:
      level:
        com.mybank.accounts: DEBUG

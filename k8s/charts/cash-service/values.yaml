image:
  repository: mybank/yp-mybank-cash
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

keycloak:
  clientSecret: ""  # Injected via --set from Jenkins credentials

db:
  schema: cash

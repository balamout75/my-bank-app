apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway-service
  labels:
    app: gateway-service
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application-k8s.yml: |
    # Конфигурация Gateway для K8s (заменяет Spring Cloud Config + Eureka)
    server:
      port: 8090

    spring:
      cloud:
        gateway:
          server:
            webflux:
              # Маршруты через K8s DNS (вместо Eureka lb://)
              routes:
                - id: accounts-service
                  uri: http://{{ .Release.Name }}-accounts-service:{{ .Values.routes.accountsService.port }}
                  predicates:
                    - Path=/api/accounts/**
                  filters:
                    - StripPrefix=1

                - id: cash-service
                  uri: http://{{ .Release.Name }}-cash-service:{{ .Values.routes.cashService.port }}
                  predicates:
                    - Path=/api/cash/**
                  filters:
                    - StripPrefix=1

                - id: transfer-service
                  uri: http://{{ .Release.Name }}-transfer-service:{{ .Values.routes.transferService.port }}
                  predicates:
                    - Path=/api/transfer/**
                  filters:
                    - StripPrefix=1

                - id: notifications-service
                  uri: http://{{ .Release.Name }}-notifications-service:{{ .Values.routes.notificationsService.port }}
                  predicates:
                    - Path=/api/notifications/**
                  filters:
                    - StripPrefix=1

              globalcors:
                cors-configurations:
                  "[/**]":
                    allowed-origins: "*"
                    allowed-methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                    allowed-headers: "*"
                    allow-credentials: false
                    max-age: 3600

              default-filters:
                - PreserveHostHeader

    # Отключаем Eureka
    eureka:
      client:
        enabled: false

    management:
      endpoint:
        gateway:
          access: unrestricted
      endpoints:
        web:
          exposure:
            include: health,info,gateway

    logging:
      level:
        org.springframework.cloud.gateway: DEBUG

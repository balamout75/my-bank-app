spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///dummy?currentSchema=notifications
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: notifications
    liquibase-schema: public
    enabled: true
  kafka:
    listener:
      auto-startup: false
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    root: INFO
    org.testcontainers: INFO
    org.springframework.security: WARN
    kafka: WARN
    org.apache.kafka: WARN
    state.change.logger: WARN
